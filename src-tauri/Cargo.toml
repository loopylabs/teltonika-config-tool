[package]
name = "teltonika-config-tool"
version = "0.1.0"
description = "Cross-platform configurator for Teltonika FM trackers"
edition = "2021"

[lib]
name = "fmconfig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
sha2 = "0.10"
btleplug = "0.13.5"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "test-util"] }
futures = "0.3.34"
tauri-plugin-log = "=2.7.1"
log = "=0.4.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "=0.17.4", features = ["bluetoothd"] }

# Keep target/ small: line tables for our own backtraces, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
