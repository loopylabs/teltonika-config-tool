[package]
name = "teltonika-config-tool"
version = "0.1.0"
description = "Cross-platform configurator for Teltonika FM trackers"
edition = "2021"

[lib]
name = "fmconfig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
flate2 = "1"

# Keep target/ small: line tables for our own backtraces, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
